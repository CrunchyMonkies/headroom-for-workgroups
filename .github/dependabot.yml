version: 2
updates:
  # This repo ships Helm charts, shell/PowerShell installers and docs — no
  # application package manager. The only ecosystem to keep current is the
  # SHA-pinned Actions in .github/workflows and .github/actions.
  #
  # Not covered by Dependabot, and worth a manual look:
  #   - the tool versions pinned inline in the workflows (helm, kubeconform,
  #     gitleaks) — see the `env:` blocks
  #   - HEADROOM_BASE_COMMIT in patches/upstream.env (CI's `patch` job tells you
  #     when it has rotted)
  #   - the datastore image tags in charts/*/values.yaml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Don't propose a version the day it appears. A compromised action release
    # is usually caught and yanked within hours-to-days; a week of aging means
    # Dependabot never hands us a SHA that the ecosystem has not looked at yet.
    # zizmor's `dependabot-cooldown` audit fails the build below 7 days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
