name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Chart.yaml is the release source of truth ────────────────────────────
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verify-versions.sh

  # ── lint + render matrix + guard rails + schema ──────────────────────────
  # Run under both major Helm versions. docs/02 claims "Helm 3.13+", and the
  # charts use lookup/dig/fromYamlArray, which behave differently enough between
  # the two lines that the claim needs testing rather than asserting.
  charts:
    name: Charts (helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.21.3, v4.2.3]
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-helm
        with:
          version: ${{ matrix.helm }}

      # Download to a file, then extract — piping curl into tar turns a
      # truncated response into "gzip: unexpected end of file" and a red build
      # (seen once already). --retry covers the transient case; landing it on
      # disk first means tar only ever sees a complete archive.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      # lint, the render matrix, the guard rails (positive and negative), and
      # strict schema validation of everything rendered.
      - run: scripts/verify-charts.sh all

  # ── the patches against upstream ─────────────────────────────────────────
  # The only check that catches a patch rotting, and it applies them in order
  # so it also catches them ceasing to stack. Without it the failure is silent:
  # the image still builds, memory quietly falls back to SQLite, and search
  # raises on every call.
  patch:
    name: Upstream patches apply
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verify-patch.sh

  # ── installers ───────────────────────────────────────────────────────────
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest. Error severity only: the
      # gate should catch real bugs, not style.
      - name: Run shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -d '' files < <(find . -name '*.sh' -not -path './.git/*' -print0)
          printf 'checking: %s\n' "${files[@]}"
          shellcheck --severity=error "${files[@]}"

      # install.sh is meant to be piped into bash from a URL. A truncated
      # download must not execute a partial script, which is what the
      # `main "$@"` on the last line buys us — assert it is still there.
      - name: install.sh is safe to pipe into bash
        run: |
          set -euo pipefail
          tail -1 install.sh | grep -qE '^main "\$@"' \
            || { echo "install.sh must end with: main \"\$@\""; exit 1; }
          echo "[ok] body is wrapped in main()"

      - name: install.sh --help and --dry-run work
        run: |
          set -euo pipefail
          bash install.sh --help >/dev/null
          bash install.sh --dry-run \
            --headroom-url https://headroom.example.com \
            --ix-url https://ix.example.com \
            --token dummy-token
          echo "[ok] dry run made no changes"
          test ! -e "$HOME/.config/headroom-workgroup/env.sh"

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pwsh is preinstalled on ubuntu-latest.
      - name: Analyse install.ps1
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $issues = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error,Warning
          if ($issues) { $issues | Format-Table -AutoSize | Out-String | Write-Host }
          $errors = @($issues | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) { throw "$($errors.Count) analyzer error(s)" }
          Write-Host "[ok] no analyzer errors"

      - name: install.ps1 -DryRun works
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./install.ps1 -DryRun -HeadroomUrl https://headroom.example.com `
            -IxUrl https://ix.example.com -Token dummy-token
          if (Test-Path "$HOME/.config/headroom-workgroup/env.ps1") {
            throw "-DryRun wrote the config file"
          }
          Write-Host "[ok] dry run made no changes"

  # ── docs ─────────────────────────────────────────────────────────────────
  docs:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verify-doc-links.sh

  # ── Aggregate gate ───────────────────────────────────────────────────────
  # One stable required-status-check context. Fails if any upstream job failed
  # OR was skipped/cancelled, so the job graph can be reshaped without orphaning
  # the required check.
  ci-success:
    name: CI Passed
    if: always()
    needs: [versions, charts, patch, shellcheck, psscriptanalyzer, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key) = \(.value.result)"' <<<"$RESULTS"
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "did not succeed: $failed"
            exit 1
          fi
          echo "all required jobs succeeded"
