{{- if eq .Values.expose.mode "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "headroom.fullname" . }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "headroom.gatewayParentRefs" . | nindent 4 }}
  {{- $hostnames := .Values.expose.gateway.hostnames }}
  {{- $host := include "headroom.exposeHost" . }}
  {{- if and (not $hostnames) $host }}
  {{- $hostnames = list $host }}
  {{- end }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Model responses stream for minutes; the Gateway API default request
      # timeout would cut them off.
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: {{ include "headroom.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
