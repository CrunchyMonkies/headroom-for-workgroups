{{- if eq .Values.expose.mode "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "headroom.fullname" . }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
  annotations:
    # Agent traffic is long-lived and streaming; the defaults on most
    # controllers are far too short for a model response.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- with .Values.expose.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with (include "headroom.ingressClassName" .) }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.expose.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "headroom.exposeHost" . | quote }}
      secretName: {{ include "headroom.tlsSecretName" . }}
  {{- end }}
  rules:
    - host: {{ include "headroom.exposeHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "headroom.fullname" . }}
                port:
                  name: http
{{- end }}
