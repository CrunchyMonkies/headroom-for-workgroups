{{- if and .Values.memory.enabled .Values.memory.neo4j.enabled (not .Values.memory.neo4j.external.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "headroom.neo4jFullname" . }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7474
      targetPort: http
    - name: bolt
      port: 7687
      targetPort: bolt
  selector:
    {{- include "headroom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "headroom.neo4jFullname" . }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  serviceName: {{ include "headroom.neo4jFullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "headroom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: neo4j
  template:
    metadata:
      labels:
        {{- include "headroom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: neo4j
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
      containers:
        - name: neo4j
          image: "{{ .Values.memory.neo4j.image.repository }}:{{ .Values.memory.neo4j.image.tag }}"
          imagePullPolicy: {{ .Values.memory.neo4j.image.pullPolicy }}
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  {{- if .Values.memory.neo4j.auth.existingSecret }}
                  name: {{ .Values.memory.neo4j.auth.existingSecret }}
                  key: neo4j-auth
                  {{- else }}
                  name: {{ include "headroom.secretName" . }}
                  key: neo4j-auth
                  {{- end }}
            # APOC is Neo4j's standard procedure library; the memory backend's
            # queries depend on it (mirrors upstream docker-compose.yml).
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_apoc_export_file_enabled
              value: "true"
            - name: NEO4J_apoc_import_file_enabled
              value: "true"
            - name: NEO4J_apoc_import_file_use__neo4j__config
              value: "true"
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            {{- toYaml .Values.memory.neo4j.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.memory.neo4j.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.memory.neo4j.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.memory.neo4j.persistence.size }}
        {{- if .Values.memory.neo4j.persistence.storageClass }}
        storageClassName: {{ .Values.memory.neo4j.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}
