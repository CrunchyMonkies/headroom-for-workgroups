{{- if and .Values.memory.enabled .Values.memory.qdrant.enabled (not .Values.memory.qdrant.external.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "headroom.qdrantFullname" . }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
  selector:
    {{- include "headroom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "headroom.qdrantFullname" . }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: {{ include "headroom.qdrantFullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "headroom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        {{- include "headroom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: qdrant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: qdrant
          image: "{{ .Values.memory.qdrant.image.repository }}:{{ .Values.memory.qdrant.image.tag }}"
          imagePullPolicy: {{ .Values.memory.qdrant.image.pullPolicy }}
          env:
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.memory.qdrant.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
      {{- if not .Values.memory.qdrant.persistence.enabled }}
      volumes:
        - name: storage
          emptyDir: {}
      {{- end }}
  {{- if .Values.memory.qdrant.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.memory.qdrant.persistence.size }}
        {{- if .Values.memory.qdrant.persistence.storageClass }}
        storageClassName: {{ .Values.memory.qdrant.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}
