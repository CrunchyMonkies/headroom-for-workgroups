{{- include "headroom.validate" . -}}
{{- if eq (include "headroom.createsSecret" .) "true" }}
{{- /*
  Resolve each credential exactly ONCE into a variable. The helpers fall back
  to randAlphaNum, so calling one twice in this file would emit two different
  values (e.g. neo4j-password disagreeing with neo4j-auth).
*/ -}}
{{- $manageNeo4j := and .Values.memory.enabled .Values.memory.neo4j.enabled (not .Values.memory.neo4j.external.enabled) (not .Values.memory.neo4j.auth.existingSecret) -}}
{{- $neo4jPassword := "" -}}
{{- if $manageNeo4j -}}
{{- $neo4jPassword = include "headroom.neo4jPassword" . -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "headroom.secretName" . }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall` alongside the PVCs. Neo4j persists its user on
    # disk, so dropping the password while keeping the volume would lock the
    # database out on reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
  proxy-token: {{ include "headroom.proxyToken" . | b64enc | quote }}
  {{- end }}
  {{- if $manageNeo4j }}
  neo4j-password: {{ $neo4jPassword | b64enc | quote }}
  # NEO4J_AUTH is the "user/password" pair the neo4j image expects at startup.
  neo4j-auth: {{ printf "%s/%s" .Values.memory.neo4j.auth.username $neo4jPassword | b64enc | quote }}
  {{- end }}
{{- end }}
