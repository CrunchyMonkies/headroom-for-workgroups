apiVersion: v1
kind: Service
metadata:
  name: {{ include "headroom.fullname" . }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "headroom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
---
{{- if and .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "headroom.serviceAccountName" . }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
{{- if and .Values.persistence.enabled (not .Values.stateless) (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-workspace" (include "headroom.fullname" .) }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
  annotations:
    # Savings history and local memory live here; keep the volume if the
    # release is removed so a reinstall can pick it back up.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
