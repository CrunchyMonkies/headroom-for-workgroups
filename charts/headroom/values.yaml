# Default values for the headroom chart.

nameOverride: ""
fullnameOverride: ""

image:
  # This repo's own build: upstream at patches/upstream.env's pinned commit plus
  # patches/0001-headroom-neo4j-config-surface.patch, published by
  # .github/workflows/release.yml. The patch only adds configuration surface —
  # with none of the new env vars set the behaviour is upstream's exactly — but
  # it is what makes `memory.enabled: true` reachable at all.
  #
  # To go back to the published upstream image, set:
  #   repository: ghcr.io/chopratejas/headroom
  # The chart then refuses `memory.enabled: true`, because that image has no way
  # to be told about a Neo4j and would silently stay on local SQLite.
  repository: ghcr.io/crunchymonkies/headroom
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

# Inbound authentication.
#
# The proxy binds 0.0.0.0 in-cluster, and upstream only exempts loopback
# callers from auth — so without a token every /v1/* route is reachable
# unauthenticated from the whole pod network. The chart therefore sets
# HEADROOM_PROXY_TOKEN by default.
#
# Leave `token` empty to have the chart generate one on first install; it is
# preserved across `helm upgrade` (read back from the live Secret) so client
# credentials are never silently rotated.
auth:
  # The proxy token and a bearer-authenticating client are mutually exclusive.
  # The check reads Authorization before X-Headroom-Proxy-Token, so it compares
  # the client's own credential against the proxy token and rejects it —
  # Claude Code on a Claude subscription can never pass, however correct the
  # X-Headroom-Proxy-Token it also sends. x-api-key clients are unaffected.
  # Turning this off is the only way to admit those clients; do it together
  # with a source-address restriction at the gateway, never alone. Reasoning
  # and the SecurityPolicy to pair it with: docs/07-troubleshooting.md,
  # "unauthorized with a valid proxy token".
  enabled: true
  token: ""
  existingSecret: ""
  existingSecretKey: proxy-token
  # Only honoured when auth.enabled=false: required to expose an
  # unauthenticated proxy through an Ingress/HTTPRoute.
  acknowledgeUnauthenticated: false

# How clients outside the cluster reach the proxy.
#   none    - ClusterIP only (use `kubectl port-forward`)
#   ingress - networking.k8s.io/v1 Ingress
#   gateway - gateway.networking.k8s.io/v1 HTTPRoute
expose:
  mode: none
  host: ""
  # Used only when host is empty and the workgroup umbrella supplies
  # global.expose.domain — the host becomes "<subdomain>.<domain>".
  subdomain: headroom
  ingress:
    className: ""         # empty => global.expose.ingressClassName, else "nginx"
    annotations: {}
    tls:
      enabled: true
      # empty => global.expose.tlsSecretName, else "<fullname>-tls"
      secretName: ""
  gateway:
    # e.g. [{name: my-gateway, namespace: gateway-system}]
    parentRefs: []
    hostnames: []

service:
  type: ClusterIP
  port: 8787
  annotations: {}

# Workspace volume: dashboard/savings history, logs, local SQLite memory.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  existingClaim: ""

# Disable all filesystem writes (HEADROOM_STATELESS=1). Lets you scale the
# proxy horizontally at the cost of local memory + savings history.
# Implies persistence is unused.
stateless: false

# Semantic memory backend (Qdrant vector search + Neo4j relationship graph).
#
# REQUIRES the patched image, which is the default above. Upstream's published
# image has no flag or env var for the Neo4j half of the connection, so the
# backend is unreachable there. See patches/README.md.
#
# Still off by default: it adds two StatefulSets and ~40Gi of storage, and the
# proxy works fully without it (local SQLite memory on the workspace PVC).
memory:
  enabled: false
  # Bypass the patched-image guard — only relevant if you have pointed
  # image.repository back at the published upstream image.
  acknowledgeUnpatchedImage: false
  topK: 10

  # Embeddings for the qdrant-neo4j backend. REQUIRED when memory.enabled=true.
  #
  # Qdrant stores the vectors; it does not produce them. Upstream's
  # DirectMem0Adapter builds a bare `OpenAI()` client and embeds with
  # text-embedding-3-small, so with no key the backend raises "Missing
  # credentials" on every init attempt, /readyz reports
  # memory.initialized=false forever, and the pod never passes its startup
  # probe. The guard in _helpers.tpl refuses to render without one rather than
  # let you find that out from a CrashLoopBackOff.
  #
  # This is the one provider credential the proxy holds itself. Everything
  # under /v1/* still forwards each caller's own key upstream — see
  # `upstream:` below.
  embeddings:
    # Inline key. Convenient, but it lands in the release's values; prefer
    # existingSecret anywhere that matters.
    apiKey: ""
    # A Secret you manage. Wins over apiKey when set.
    existingSecret: ""
    existingSecretKey: api-key
    # Any OpenAI-compatible /v1/embeddings endpoint — a local text-embeddings
    # server, LiteLLM, Azure OpenAI. Sets OPENAI_BASE_URL. The key is still
    # required; send a placeholder if your endpoint ignores it.
    #
    # Point this anywhere other than OpenAI and you must rebuild the Qdrant
    # collection at your model's vector width before memory can store anything.
    # Upstream hardcodes the model name and never passes embedding_model_dims,
    # so mem0 creates the collection at text-embedding-3-small's 1536 while your
    # endpoint returns its own width (1024 for Qwen and Jina, 768 for most BGE
    # and E5) — it answers 200, and Qdrant then rejects every write with
    # "expected dim: 1536, got 1024". /readyz stays healthy throughout, so this
    # looks exactly like an embeddings outage. Procedure and the reason it
    # sticks: docs/07-troubleshooting.md, "The embeddings endpoint is healthy,
    # and writes still fail on dimensions".
    baseUrl: ""

  qdrant:
    enabled: true
    image:
      repository: qdrant/qdrant
      tag: v1.17.1
      pullPolicy: IfNotPresent
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources: {}
    # Point at an existing Qdrant instead of deploying one.
    external:
      enabled: false
      url: ""
      apiKeySecret: ""
      apiKeySecretKey: api-key

  neo4j:
    enabled: true
    image:
      repository: neo4j
      tag: "5.26"
      pullPolicy: IfNotPresent
    auth:
      username: neo4j
      password: ""              # empty => generated and preserved across upgrades
      existingSecret: ""
      existingSecretKey: neo4j-password
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources: {}
    external:
      enabled: false
      uri: ""

# Upstream provider overrides. Note the proxy holds NO provider credentials —
# it forwards each caller's own x-api-key / authorization header upstream.
upstream:
  anthropicApiUrl: ""
  openaiApiUrl: ""

# Disable outbound update checks by default; set offline=true to hard-disable
# all egress (telemetry, model downloads) for air-gapped clusters.
updateCheck: false
offline: false
corsOrigins: ""

extraEnv: []
extraEnvFrom: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 4Gi

# The image runs as uid/gid 1000 ("nonroot"); fsGroup lets it write the PVC.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Cold start loads compression models, which takes longer than the image's own
# 20s start period allows; the startup probe covers that window.
probes:
  startup:
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 60
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

networkPolicy:
  enabled: true
  # Empty => allow proxy ingress from anywhere in the cluster. Datastores are
  # always restricted to the proxy pod regardless of this setting.
  proxyIngressFrom: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
