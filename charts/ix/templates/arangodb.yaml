{{- if .Values.arangodb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ix.arangoFullname" . }}
  labels:
    {{- include "ix.labels" . | nindent 4 }}
    app.kubernetes.io/component: arangodb
spec:
  type: ClusterIP
  ports:
    - name: arangodb
      port: 8529
      targetPort: arangodb
      protocol: TCP
  selector:
    {{- include "ix.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: arangodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ix.arangoFullname" . }}
  labels:
    {{- include "ix.labels" . | nindent 4 }}
    app.kubernetes.io/component: arangodb
spec:
  serviceName: {{ include "ix.arangoFullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: arangodb
  template:
    metadata:
      labels:
        {{- include "ix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: arangodb
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: arangodb
          image: "{{ .Values.arangodb.image.repository }}:{{ .Values.arangodb.image.tag }}"
          imagePullPolicy: {{ .Values.arangodb.image.pullPolicy }}
          # Upstream compose runs this with ARANGO_NO_AUTH=1. In-cluster the
          # port is reachable by anything the NetworkPolicy allows, so the
          # root password is always set.
          #
          # args, NOT command — this is load-bearing and the distinction is the
          # whole reason ARANGO_ROOT_PASSWORD below does anything. The image is
          # ENTRYPOINT ["/entrypoint.sh"] + CMD ["arangod"]; `command:` replaces
          # the entrypoint, and /entrypoint.sh is the only thing that reads
          # ARANGO_ROOT_PASSWORD (line ~76, `arango-init-database`, gated on
          # `[ "$1" = 'arangod' ]` and an empty datadir). Override the entrypoint
          # and arangod starts perfectly well with no root user ever created —
          # the secret is mounted, ignored, and root ends up with an empty
          # password. Nothing logs a complaint; the only symptom is every
          # authenticated client getting `401 … not authorized`, which reads
          # like a wrong password rather than a bypassed bootstrap.
          # 0.1.2 and earlier shipped this as `command:`.
          #
          # args replaces CMD but keeps the entrypoint, so `arangod` has to stay
          # spelled out here as the first element — that is what the entrypoint
          # matches on. It then appends its own --server.authentication and
          # --config /tmp/arangod.conf before exec'ing.
          args:
            - arangod
            - --server.endpoint
            - tcp://0.0.0.0:8529
            - --experimental-vector-index
          env:
            - name: ARANGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ix.arangoSecretName" . }}
                  key: {{ include "ix.arangoSecretKey" . }}
          ports:
            - name: arangodb
              containerPort: 8529
          # /_admin/server/availability, not /_api/version. ArangoDB requires
          # authentication on /_api and on the rest of /_admin, and this chart
          # always sets a root password — so a /_api/version probe answers 401
          # forever: never ready, and killed by the liveness probe every 30s.
          # /_admin/server/availability is the one endpoint ArangoDB serves
          # anonymously, and 200 there means exactly what a probe wants to know
          # (up, recovered, accepting requests).
          readinessProbe:
            httpGet:
              path: /_admin/server/availability
              port: arangodb
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_admin/server/availability
              port: arangodb
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/arangodb3
          resources:
            {{- toYaml .Values.arangodb.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.arangodb.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.arangodb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.arangodb.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.arangodb.persistence.size }}
  {{- end }}
{{- end }}
