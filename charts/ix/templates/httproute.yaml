{{- if eq .Values.expose.mode "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ix.fullname" . }}
  labels:
    {{- include "ix.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "ix.gatewayParentRefs" . | nindent 4 }}
  {{- $hostnames := .Values.expose.gateway.hostnames }}
  {{- $host := include "ix.exposeHost" . }}
  {{- if and (not $hostnames) $host }}
  {{- $hostnames = list $host }}
  {{- end }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # A full `ix map` of a large repo commits in one long request.
      timeouts:
        request: 900s
        backendRequest: 900s
      backendRefs:
        - name: {{ include "ix.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
