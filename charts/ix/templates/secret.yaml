{{- include "ix.validate" . -}}
{{- if not .Values.arangodb.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ix.secretName" . }}
  labels:
    {{- include "ix.labels" . | nindent 4 }}
  annotations:
    # Keep the generated password if the release is uninstalled with data
    # volumes retained — otherwise Arango's on-disk user would be orphaned.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  arango-password: {{ include "ix.arangoPassword" . | quote }}
{{- end }}
